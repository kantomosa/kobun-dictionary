<style>
:root {

  --accent2:#a78bfa; --good:#34d399; --warn:#fbbf24; --chip:#223050;

}
:root.light {
  color-scheme: light;
  --bg:#f6f7fb; --surface:#ffffff; --surface2:#eef2ff; --card:#ffffff;
  --text:#172033; --muted:#5c667c; --line:#dfe5f2; --accent:#0ea5e9;
  --accent2:#7c3aed; --good:#059669; --warn:#b45309; --chip:#edf2ff;

}
*{box-sizing:border-box}
html,body{margin:0; min-height:100%; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","YuGothic","Noto Sans JP",Meiryo,sans-serif;}
body{overflow-x:hidden;}
button,input,select{font:inherit}
.app{max-width:900px; margin:0 auto; padding:0 14px 88px;}
.header{position:sticky; top:0; z-index:20; margin:0 -14px; padding:12px 14px 10px; background:linear-gradient(180deg,var(--bg) 76%,rgba(0,0,0,0)); backdrop-filter:blur(14px);}
.hero{border:1px solid var(--line); background:linear-gradient(135deg,var(--surface),var(--surface2)); border-radius:24px; padding:16px; box-shadow:var(--shadow);}
.toprow{display:flex; align-items:center; justify-content:space-between; gap:10px}
h1{font-size:20px; margin:0; letter-spacing:.02em}
.sub{margin:6px 0 0; color:var(--muted); font-size:13px; line-height:1.55}
.iconbtn{min-width:44px; min-height:44px; border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:999px; display:inline-grid; place-items:center; cursor:pointer}
.searchbox{margin-top:14px; display:flex; gap:8px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:9px 12px}
.searchbox input{width:100%; border:0; outline:0; color:var(--text); background:transparent; font-size:16px}
.controls{display:flex; gap:8px; overflow:auto; padding:10px 2px 2px; scrollbar-width:none}
.controls::-webkit-scrollbar{display:none}
.pill{border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:999px; padding:10px 13px; white-space:nowrap; min-height:42px; cursor:pointer}
.pill.active{background:linear-gradient(135deg,var(--accent),var(--accent2)); color:white; border-color:transparent; font-weight:700}
.filters{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px}
select{width:100%; min-height:44px; border:1px solid var(--line); border-radius:14px; padding:0 12px; background:var(--card); color:var(--text)}
.stats{display:flex; justify-content:space-between; align-items:center; margin:16px 2px 8px; color:var(--muted); font-size:13px}
.list{display:grid; gap:10px}
.item{text-align:left; width:100%; border:1px solid var(--line); background:var(--surface); color:var(--text); border-radius:20px; padding:14px; box-shadow:0 8px 22px rgba(0,0,0,.10); cursor:pointer}
.item:active{transform:scale(.99)}
.itemhead{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
.word{font-size:22px; font-weight:800; letter-spacing:.03em}
.kana{font-size:12px; color:var(--muted); margin-left:5px; font-weight:500}
.badges{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end}
.badge{font-size:11px; line-height:1; padding:6px 8px; border-radius:999px; background:var(--chip); color:var(--muted); border:1px solid var(--line)}
.badge.main{color:white; background:var(--accent2); border-color:transparent}
.badge.verb{background:rgba(52,211,153,.16); color:var(--good); border-color:rgba(52,211,153,.3)}
.badge.aux{background:rgba(125,211,252,.16); color:var(--accent); border-color:rgba(125,211,252,.3)}
.summary{margin:10px 0 0; color:var(--muted); line-height:1.55; font-size:14px}
.tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
.tag{font-size:12px; padding:6px 8px; border-radius:999px; background:var(--chip); color:var(--text)}
.empty{padding:28px 10px; color:var(--muted); text-align:center}
.detail{display:none}
.detail.active,.home.hidden{display:none}
.home{display:block}
.detail.active{display:block}
.backbar{position:sticky; top:0; z-index:30; margin:0 -14px; padding:10px 14px; background:var(--bg); border-bottom:1px solid var(--line)}
.backbtn{min-height:46px; border:1px solid var(--line); background:var(--surface); color:var(--text); border-radius:999px; padding:0 14px; cursor:pointer}
.detailHero{margin-top:14px; border:1px solid var(--line); border-radius:26px; background:linear-gradient(135deg,var(--surface),var(--surface2)); padding:18px; box-shadow:var(--shadow)}
.detailTitle{display:flex; justify-content:space-between; gap:12px; align-items:flex-start}
.detailTitle h2{font-size:32px; margin:0}
.card{margin-top:12px; border:1px solid var(--line); border-radius:20px; background:var(--surface); padding:14px}
.card h3{font-size:15px; margin:0 0 10px; color:var(--accent)}
.grid2{display:grid; grid-template-columns:1fr; gap:8px}
.kv{display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted)}
.tablewrap{overflow-x:auto; border:1px solid var(--line); border-radius:16px}
table{width:100%; border-collapse:collapse; min-width:520px; background:var(--card)}
th,td{padding:12px 10px; border-bottom:1px solid var(--line); text-align:center; vertical-align:middle}
th{color:var(--muted); font-size:12px; background:var(--surface2)}
td{font-weight:700}
tr:last-child td{border-bottom:0}
.meaningList{display:flex; gap:8px; flex-wrap:wrap}
.note{color:var(--muted); line-height:1.7; margin:0}
.example{padding:10px 0; border-bottom:1px dashed var(--line)}
.example:last-child{border-bottom:0}
.example b{display:block; margin-bottom:4px}
.footer{color:var(--muted); font-size:12px; line-height:1.6; padding:24px 4px}

/* 縦型活用表 */
.vconj{
  display:grid;
  grid-template-columns:minmax(0,1fr) 68px;
  border:1px solid var(--line);
  border-radius:18px;
  overflow:hidden;
  background:var(--card);
  max-width:420px;
  margin:0 auto;
}
.vrow{display:contents}
.vform,.vlabel{
  min-height:76px;
  border-bottom:1px solid var(--line);
  display:grid;
  place-items:center;
}
.vrow:last-child .vform,
.vrow:last-child .vlabel{border-bottom:0}
.vform{
  background:linear-gradient(180deg, rgba(125,211,252,.16), rgba(167,139,250,.10));
  color:var(--text);
  font-weight:900;
  font-size:28px;
  letter-spacing:.08em;
  padding:12px 8px;
  writing-mode:vertical-rl;
  text-orientation:upright;
  line-height:1.25;
}
.vrow:nth-child(even) .vform{
  background:linear-gradient(180deg, rgba(251,191,36,.13), rgba(167,139,250,.08));
}
.vform.empty{
  color:var(--muted);
  font-size:24px;
  letter-spacing:0;
}
.vlabel{
  background:var(--surface2);
  color:var(--muted);
  font-weight:800;
  font-size:15px;
  padding:10px 6px;
  writing-mode:vertical-rl;
  text-orientation:upright;
  letter-spacing:.08em;
}
.vcaption{
  max-width:420px;
  margin:10px auto 0;
  color:var(--muted);
  font-size:12px;
  line-height:1.6;
}
@media (max-width:380px){
  .vconj{grid-template-columns:minmax(0,1fr) 58px}
  .vform{font-size:24px; min-height:70px}
  .vlabel{font-size:13px}
}

@media (min-width:700px){
  .app{padding-left:22px; padding-right:22px}

  h1{font-size:26px} .list{grid-template-columns:1fr 1fr} .grid2{grid-template-columns:1fr 1fr}
}
</style>

const state = { type:'all', q:'', conj:'', conn:'' };
const $ = sel => document.querySelector(sel);
const listEl = $('#list'), countEl = $('#count');
const homeEl = $('#home'), detailEl = $('#detail'), detailContent = $('#detailContent');

const savedTheme = localStorage.getItem('kobun-theme');
if(savedTheme === 'light') document.documentElement.classList.add('light');
function syncThemeBtn(){ $('#themeBtn').textContent = document.documentElement.classList.contains('light') ? '☀️' : '🌙'; }
syncThemeBtn();

$('#themeBtn').addEventListener('click', () => {
  document.documentElement.classList.toggle('light');
  localStorage.setItem('kobun-theme', document.documentElement.classList.contains('light') ? 'light' : 'dark');
  syncThemeBtn();
});

function unique(arr){ return [...new Set(arr.filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja')); }
function initFilters(){
  const conjs = unique(WORDS.map(w=>w.conjType));
  const conSel = $('#conjFilter');
  conjs.forEach(v=> conSel.insertAdjacentHTML('beforeend', `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`));
  const conns = unique(WORDS.filter(w=>w.type==='助動詞').map(w=>w.connection));
  const connSel = $('#connFilter');
  conns.forEach(v=> connSel.insertAdjacentHTML('beforeend', `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`));
}
function escapeHtml(s=''){ return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function haystack(w){
  return [
    w.word,w.kana,w.type,w.conjType,w.row,w.connection,w.summary,w.note,
    ...(w.meanings||[]),
    ...Object.values(w.forms||{}),
    ...(w.examples||[]).flatMap(e=>[e.text,e.translation])
  ].join(' ').toLowerCase();
}
function filtered(){
  const q = state.q.trim().toLowerCase();
  return WORDS.filter(w => {
    if(state.type !== 'all' && w.type !== state.type) return false;
    if(state.conj && w.conjType !== state.conj) return false;
    if(state.conn && w.connection !== state.conn) return false;
    if(q && !haystack(w).includes(q)) return false;
    return true;
  });
}
function renderList(){
  const rows = filtered();
  countEl.textContent = `${rows.length}件 / ${WORDS.length}件`;
  if(!rows.length){ listEl.innerHTML = '<div class="empty">該当する項目がありません。</div>'; return; }
  listEl.innerHTML = rows.map(w => `
    <button class="item" data-id="${escapeHtml(w.id)}">
      <div class="itemhead">
        <div><span class="word">${escapeHtml(w.word)}</span><span class="kana">${escapeHtml(w.kana||'')}</span></div>
        <div class="badges">
          <span class="badge ${w.type==='動詞'?'verb':'aux'}">${escapeHtml(w.type)}</span>
          <span class="badge main">${escapeHtml(w.conjType)}</span>
        </div>
      </div>
      <p class="summary">${escapeHtml(w.summary||'')}</p>
      <div class="tags">
        ${w.row ? `<span class="tag">${escapeHtml(w.row)}</span>` : ''}
        ${w.connection ? `<span class="tag">${escapeHtml(w.connection)}</span>` : ''}
        ${(w.meanings||[]).slice(0,4).map(m=>`<span class="tag">${escapeHtml(m)}</span>`).join('')}
      </div>
    </button>`).join('');
  listEl.querySelectorAll('.item').forEach(btn=> btn.addEventListener('click',()=>showDetail(btn.dataset.id)));
}

function formTable(w){
  const order = w.type === '助動詞'
    ? [
        ['基本形','基本形'],
        ['未然','未然形'],
        ['連用','連用形'],
        ['終止','終止形'],
        ['連体','連体形'],
        ['已然','已然形'],
        ['命令','命令形']
      ]
    : [
        ['語幹','語幹'],
        ['未然','未然形'],
        ['連用','連用形'],
        ['終止','終止形'],
        ['連体','連体形'],
        ['已然','已然形'],
        ['命令','命令形']
      ];

  const rows = order.map(([key,label]) => {
    const raw = (w.forms || {})[key] ?? '—';
    const isEmpty = raw === '—' || raw === '' || raw === '〇' || raw === '○';
    return `
      <div class="vrow">
        <div class="vform ${isEmpty ? 'empty' : ''}">${escapeHtml(raw)}</div>
        <div class="vlabel">${escapeHtml(label)}</div>
      </div>`;
  }).join('');

  const extra = w.type === '助動詞'
    ? `<p class="vcaption">活用の型：${escapeHtml(w.conjType)}${w.forms && w.forms['語幹'] ? ` ／ 語幹：${escapeHtml(w.forms['語幹'])}` : ''}</p>`
    : `<p class="vcaption">活用の種類：${escapeHtml(w.conjType)}${w.row ? ` ／ ${escapeHtml(w.row)}` : ''}</p>`;

  return `<div class="vconj">${rows}</div>${extra}`;
}
function showDetail(id){
  const w = WORDS.find(x=>x.id===id);
  if(!w) return;
  detailContent.innerHTML = `
    <section class="detailHero">
      <div class="detailTitle">
        <div>
          <h2>${escapeHtml(w.word)} <span class="kana">${escapeHtml(w.kana||'')}</span></h2>
          <p class="summary">${escapeHtml(w.summary||'')}</p>
        </div>
        <div class="badges"><span class="badge ${w.type==='動詞'?'verb':'aux'}">${escapeHtml(w.type)}</span></div>
      </div>
      <div class="tags">${(w.meanings||[]).map(m=>`<span class="tag">${escapeHtml(m)}</span>`).join('')}</div>
    </section>
    <section class="card">
      <h3>基本情報</h3>
      <div class="grid2">
        <div class="kv"><span>品詞</span><b>${escapeHtml(w.type)}</b></div>
        <div class="kv"><span>活用</span><b>${escapeHtml(w.conjType)}</b></div>
        ${w.row ? `<div class="kv"><span>行</span><b>${escapeHtml(w.row)}</b></div>` : ''}
        ${w.connection ? `<div class="kv"><span>接続</span><b>${escapeHtml(w.connection)}</b></div>` : ''}
      </div>
    </section>
    <section class="card">
      <h3>活用表</h3>
      ${formTable(w)}
    </section>
    <section class="card">
      <h3>${w.type==='助動詞'?'識別・覚え方のポイント':'補足'}</h3>
      <p class="note">${escapeHtml(w.note||'')}</p>
    </section>
    ${(w.examples&&w.examples.length) ? `<section class="card"><h3>${w.type==='動詞'?'代表例語':'例文・現代語訳'}</h3>${w.examples.map(e=>`<div class="example"><b>${escapeHtml(e.text)}</b><span class="note">${escapeHtml(e.translation)}</span></div>`).join('')}</section>` : ''}
  `;
  homeEl.classList.add('hidden');
  detailEl.classList.add('active');
  window.scrollTo({top:0, behavior:'smooth'});
}
$('#backBtn').addEventListener('click',()=>{
  detailEl.classList.remove('active');
  homeEl.classList.remove('hidden');
  setTimeout(()=>$('#q').focus({preventScroll:true}),0);
});
$('#q').addEventListener('input', e=>{ state.q=e.target.value; renderList(); });
$('#conjFilter').addEventListener('change', e=>{ state.conj=e.target.value; renderList(); });
$('#connFilter').addEventListener('change', e=>{ state.conn=e.target.value; renderList(); });
$('#typeFilters').addEventListener('click', e=>{
  const b=e.target.closest('button[data-type]'); if(!b) return;
  state.type=b.dataset.type;
  document.querySelectorAll('#typeFilters .pill').forEach(x=>x.classList.toggle('active', x===b));
  renderList();
});
initFilters();
renderList();
</script>
